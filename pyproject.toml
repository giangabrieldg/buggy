[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant"
version = "0.1.0"
description = "A local personal AI assistant for Windows"
requires-python = ">=3.11"
dependencies = [
    "customtkinter",
    "ollama",
    "pypdf",
    "python-docx",
    "pystray",
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest", "reportlab"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_assistant = ["assets/*.png", "assets/*.ico", "assets/expressions/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
